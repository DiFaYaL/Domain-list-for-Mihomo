name: Build domain MRS

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.lst"
      - "scripts/convert.py"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest mihomo
        run: |
          # Скачиваем стабильное ядро Mihomo и ставим его в систему, чтобы скрипт Python мог его вызвать
          M_VER=$(curl -s https://github.com | \
                  grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Latest mihomo version: $M_VER"
          wget -O mihomo.gz https://github.com{M_VER}/mihomo-linux-amd64-v${M_VER}.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/
          mihomo -v

      - name: Generate lists (All compilation inside Python)
        run: |
          # Запускаем скрипт, теперь вся сборка .yaml и .mrs происходит внутри него
          python3 scripts/convert.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Находим и добавляем абсолютно все три типа файлов (.lst, .yaml, .mrs) во всех папках
          find . -type f \( -name "*.mrs" -o -name "*.yaml" -o -name "*.lst" \) -not -path "*/.github/*" -print0 | xargs -0 git add
          
          if git commit -m "Auto-update compiled rule sets (.lst, .yaml, .mrs) [skip ci]"; then
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
