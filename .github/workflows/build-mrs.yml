name: Build domain MRS

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.lst"
      - "scripts/convert.py"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache mihomo
        uses: actions/cache@v4
        id: cache-mihomo
        with:
          path: /usr/local/bin/mihomo
          key: mihomo-1.19.8

      - name: Install mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://github.com/MetaCubeX/mihomo/releases/download/v1.19.8/mihomo-linux-amd64-v1.19.8.gz | gunzip > mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build MRS
        run: python3 scripts/convert.py

      - name: Commit MRS files
        uses: EndBug/add-and-commit@v9
        with:
          add: "**/*.mrs"
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "Auto-build .mrs [skip ci]"
          push: true
