name: Build domain MRS

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.lst"
      - "scripts/convert.py"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download mihomo
        run: |
          wget -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.8/mihomo-linux-amd64-v1.19.8.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Build MRS from LST
        run: |
          python3 scripts/convert.py

      - name: Commit generated MRS and TXT files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          # Добавляем в индекс файлы .mrs и созданные текстовые логи .txt
          find . -type f \( -name "*.mrs" -o -name "*.txt" \) -not -path "*/scripts/*" -print0 | xargs -0 git add

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-build .mrs and .txt logs from .lst [skip ci]"
          git push
